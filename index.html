<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudySpark</title>

    <link rel="stylesheet" href="style.css" />

    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h1>StudySpark</h1>
      <p id="progress"></p>

      <div class="card-container" id="card-trigger">
        <div class="card" id="card-inner">
          <div class="card-face card-front">
            <p class="label">Question</p>
            <h2 id="question-text"></h2>
            <span class="hint">Click to flip</span>
          </div>

          <div class="card-face" id="card-back">
            <p class="label">Answer</p>
            <h2 id="question-answer"></h2>
            <span class="hint">Click to flip</span>
          </div>
        </div>
      </div>

      <div class="navigation-btns">
        <button id="prev-btn">Previous</button>
        <button id="next-btn">Next</button>
      </div>
    </div>

    <div class="card-form-container">
      <form id="card-form">
        <label>Question:</label>
        <input id="user-question" type="text" placeholder="Enter question" />

        <label>Answer:</label>
        <input
          id="user-answer"
          type="text"
          placeholder="Enter answer"
          autocomplete="off"
        />

        <button type="submit">Add flashcard</button>
      </form>
    </div>
  </body>
</html>
